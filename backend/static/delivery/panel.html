<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A3D">
  <title>Delivery | Donde David</title>
  <link rel="stylesheet" href="/static/css/global.css?v=2.0">
  <link rel="stylesheet" href="/static/css/toon-theme.css?v=2.4">
  <link rel="stylesheet" href="/static/css/index.css?v=2.0">
  <style>
    .delivery-shell { max-width: 1100px; margin: 0 auto; padding: clamp(.75rem, 3vw, 1.5rem); }
    .delivery-hero { background: linear-gradient(135deg, rgba(0,245,212,.13), rgba(255,188,13,.1)); border: 1px solid var(--cyan-accent); border-radius: 20px; padding: clamp(1rem, 3vw, 1.5rem); margin: 1rem 0; }
    .delivery-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin-top: 1rem; }
    .delivery-summary-card { background: var(--toon-card); border: 1px solid var(--toon-border); border-radius: 14px; padding: .8rem; }
    .delivery-card { background: var(--toon-card); border: 1px solid var(--toon-border); border-left: 4px solid var(--cyan-accent); border-radius: 16px; padding: clamp(.9rem, 3vw, 1.25rem); margin: 1rem 0; box-shadow: 0 8px 26px rgba(0,0,0,.15); }
    .delivery-card h2 { font-size: 1.15rem; }
    .delivery-card p { overflow-wrap: anywhere; }
    .delivery-state { display: inline-flex; align-items: center; padding: .35rem .65rem; border-radius: 20px; background: rgba(0,245,212,.12); color: var(--cyan-accent); font-size: .78rem; font-weight: 900; }
    .delivery-progress { display: flex; gap: .25rem; margin: .75rem 0; }
    .delivery-progress span { height: 5px; flex: 1; background: var(--toon-border); border-radius: 5px; }
    .delivery-progress span.active { background: var(--cyan-accent); }
    .delivery-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
    .delivery-actions .btn { min-height: 44px; }
    .delivery-empty { padding: 2rem 1rem; text-align: center; color: var(--text-muted); }
    @media (max-width: 520px) {
      .delivery-summary { grid-template-columns: 1fr; gap: .5rem; }
      .delivery-actions > * { width: 100%; }
      .delivery-actions input { box-sizing: border-box; }
    }
  </style>
</head>
<body class="toon-theme">
  <header id="app-header"></header>
  <main class="delivery-shell">
    <section class="delivery-hero">
      <h1 style="margin:.2rem 0">🛵 Panel del repartidor</h1>
      <p style="color:var(--text-muted); margin:.5rem 0">Tus entregas asignadas, rutas y confirmación de entrega en un solo lugar.</p>
      <button class="btn btn-outline" type="button" onclick="loadCourierOrders()">↻ Actualizar pedidos</button>
      <div class="delivery-summary" aria-label="Resumen de entregas">
        <div class="delivery-summary-card"><small>Asignadas</small><div id="courier-count-assigned" style="font-size:1.35rem;font-weight:900">0</div></div>
        <div class="delivery-summary-card"><small>En ruta</small><div id="courier-count-route" style="font-size:1.35rem;font-weight:900">0</div></div>
        <div class="delivery-summary-card"><small>Por entregar</small><div id="courier-count-open" style="font-size:1.35rem;font-weight:900">0</div></div>
      </div>
    </section>
    <section aria-labelledby="courier-list-title">
      <h2 id="courier-list-title">Mis entregas</h2>
      <div id="courier-orders" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/js/auth.js?v=2.0"></script>
  <script src="/static/js/theme-toggle.js?v=2.1"></script>
  <script src="/static/js/appShell.js?v=2.3"></script>
  <script src="/static/js/websocket.js?v=2.0"></script>
  <script src="/static/js/delivery.js?v=1.0"></script>
</body>
</html>
