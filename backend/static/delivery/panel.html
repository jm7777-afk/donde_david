<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A3D">
  <title>Delivery | Donde David</title>
  <link rel="stylesheet" href="/static/css/global.css?v=5.2">
  <link rel="stylesheet" href="/static/css/toon-theme.css?v=5.2">
  <link rel="stylesheet" href="/static/css/index.css?v=5.2">
  <link rel="stylesheet" href="/static/css/pages/delivery-panel.css?v=5.2">
  <link rel="stylesheet" href="/static/css/utilities.css?v=5.2">
</head>
<body class="toon-theme">
  <header id="app-header"></header>
  <main class="delivery-shell">
    <section class="delivery-hero">
      <h1 class="u-margin-0p2rem-0">🛵 Panel del repartidor</h1>
      <p class="u-color-token-text-muted u-margin-0p5rem-0">Tus entregas asignadas, rutas y confirmación de entrega en un solo lugar.</p>
      <button class="btn btn-outline" type="button" onclick="loadCourierOrders()">↻ Actualizar pedidos</button>
      <p id="courier-location-status" role="status" class="u-color-token-text-muted u-margin-0p65rem-0-0">La ubicación en vivo se activa al iniciar una entrega.</p>
      <div class="delivery-summary" aria-label="Resumen de entregas">
        <div class="delivery-summary-card"><small>Asignadas</small><div id="courier-count-assigned" class="u-font-size-1-35rem u-font-weight-900">0</div></div>
        <div class="delivery-summary-card"><small>En ruta</small><div id="courier-count-route" class="u-font-size-1-35rem u-font-weight-900">0</div></div>
        <div class="delivery-summary-card"><small>Por entregar</small><div id="courier-count-open" class="u-font-size-1-35rem u-font-weight-900">0</div></div>
      </div>
    </section>
    <section aria-labelledby="courier-list-title">
      <h2 id="courier-list-title">Mis entregas</h2>
      <div id="courier-orders" aria-live="polite"></div>
    </section>
  </main>
  <script src="/static/js/auth.js?v=5.2"></script>
  <script src="/static/js/appShell.js?v=5.2"></script>
  <script src="/static/js/websocket.js?v=5.2"></script>
  <script src="/static/js/delivery.js?v=5.2"></script>
</body>
</html>
