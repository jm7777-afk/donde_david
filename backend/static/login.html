<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DONDE DAVID - Portal de Personal & Empleados</title>
  <link rel="stylesheet" href="/static/css/global.css?v=4.0">
  <link rel="stylesheet" href="/static/css/toon-theme.css?v=4.0">
  <link rel="stylesheet" href="/static/css/index.css?v=4.0">
  <link rel="stylesheet" href="/static/css/login.css?v=4.0">
  <link rel="stylesheet" href="/static/css/utilities.css?v=4.0">
</head>
<body class="login-portal-body">

  <div class="portal-card">
    
    <div class="login-brand">
      <a href="#" aria-label="Recargar página" onclick="window.location.reload(); return false;">
        <img src="/static/images/logo-donde-david.jpg" class="login-brand-logo" alt="Donde David Logo">
      </a>
      <h1 class="login-brand-title">PORTAL DE PERSONAL</h1>
      <p class="login-brand-subtitle">Ingreso Exclusivo para Empleados y Administradores - DONDE DAVID</p>
    </div>

    <form id="staff-portal-form">
      <div class="form-group">
        <label for="portal-user">Nombre de Usuario</label>
        <input type="text" id="portal-user" class="form-control" placeholder="Ingresa tu usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="portal-pass">Contraseña</label>
        <div class="password-input-wrapper">
          <input type="password" id="portal-pass" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" id="toggle-portal-pass" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <div class="login-options-row">
        <label class="login-remember-label" for="portal-remember">
          <input type="checkbox" id="portal-remember">
          <span>Recordar contraseña</span>
        </label>
        <a href="javascript:void(0)" class="login-forgot-link" onclick="forgotPasswordAlert()">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-cta login-submit-button">
        🔐 INICIAR SESIÓN DE TRABAJO
      </button>
    </form>

    <div class="login-demo-panel">
      <div class="login-demo-title">ACCESOS DIRECTOS DEMO:</div>
      <div class="login-demo-grid">
        <button class="demo-role-btn" onclick="quickStaffLogin('admin', 'admin123', '/static/admin/index.html')">⚙️ Administrador</button>
        <button class="demo-role-btn" onclick="quickStaffLogin('caja', 'caja123', '/static/caja/panel.html')">💰 Caja POS</button>
        <button class="demo-role-btn" onclick="quickStaffLogin('cocina1', 'cocina123', '/static/cocina/monitor.html')">👨‍🍳 Cocina KDS</button>
        <button class="demo-role-btn" onclick="quickStaffLogin('delivery1', 'delivery123', '/static/delivery/panel.html')">🛵 Repartidor</button>
      </div>
    </div>

    <div class="login-footer">
      <a href="/static/index.html" class="login-footer-link">← Volver al Sitio Web Público</a>
    </div>

  </div>

  <script src="/static/js/websocket.js?v=4.0"></script>
  <script src="/static/js/auth.js?v=4.0"></script>
  <script src="/static/js/appShell.js?v=4.0"></script>
  <script>
    const rememberCheckbox = document.getElementById("portal-remember");
    const userInput = document.getElementById("portal-user");
    const passInput = document.getElementById("portal-pass");
    const togglePassBtn = document.getElementById("toggle-portal-pass");

    // Alternar visibilidad de contraseña
    if (togglePassBtn && passInput) {
      togglePassBtn.addEventListener("click", () => {
        const isPass = passInput.type === "password";
        passInput.type = isPass ? "text" : "password";
        togglePassBtn.textContent = isPass ? "🙈" : "👁️";
      });
    }

    // Cargar credenciales recordadas si existen
    try {
      const savedUser = localStorage.getItem("donde_david_portal_user");
      const savedPass = localStorage.getItem("donde_david_portal_pass");
      const isRemembered = localStorage.getItem("donde_david_portal_remember") === "true";
      if (isRemembered && savedUser) {
        userInput.value = savedUser;
        if (savedPass) {
          try {
            passInput.value = atob(savedPass);
          } catch (_) {
            passInput.value = savedPass;
          }
        }
        rememberCheckbox.checked = true;
      }
    } catch (err) {
      console.warn("No se pudo acceder al almacenamiento local", err);
    }

    document.getElementById("staff-portal-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = userInput.value.trim();
      const p = passInput.value;

      // Guardar o eliminar credenciales según estado del checkbox
      try {
        if (rememberCheckbox && rememberCheckbox.checked) {
          localStorage.setItem("donde_david_portal_user", u);
          localStorage.setItem("donde_david_portal_pass", btoa(p));
          localStorage.setItem("donde_david_portal_remember", "true");
        } else {
          localStorage.removeItem("donde_david_portal_user");
          localStorage.removeItem("donde_david_portal_pass");
          localStorage.removeItem("donde_david_portal_remember");
        }
      } catch (err) {
        console.warn("Error almacenando credenciales", err);
      }

      try {
        const res = await Auth.login(u, p);
        showToast(`Bienvenido ${res.usuario.nombre}`, "success");
        setTimeout(() => redirectByRole(res.usuario.rol), 600);
      } catch (err) {
        showToast(err.message, "danger");
      }
    });

    function forgotPasswordAlert() {
      alert("Para recuperar o reasignar tu contraseña, comunícate con la Administración o Gerencia del restaurante para restablecer tus credenciales.");
    }

    async function quickStaffLogin(user, pass, redirectUrl) {
      try {
        await Auth.login(user, pass);
        window.location.href = redirectUrl;
      } catch (err) {
        showToast(err.message, "danger");
      }
    }

    function redirectByRole(rol) {
      if (rol === 'admin' || rol === 'supervisor') window.location.href = '/static/admin/index.html';
      else if (rol === 'gerente') window.location.href = '/static/gerencia/panel.html';
      else if (rol === 'cocina') window.location.href = '/static/cocina/monitor.html';
      else if (rol === 'caja') window.location.href = '/static/caja/panel.html';
      else if (rol === 'mesero') window.location.href = '/static/mesero/panel.html';
      else if (rol === 'repartidor') window.location.href = '/static/delivery/panel.html';
      else window.location.href = '/static/admin/index.html';
    }
  </script>
</body>
</html>
