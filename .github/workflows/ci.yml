name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///./test_restaurante.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Check frontend JavaScript syntax
        run: |
          for f in backend/static/js/*.js backend/static/js/**/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Check fresh database migration and model alignment
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: sqlite:///./migration_smoke.db
      - name: Run tests
        run: pytest tests -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          cache-dependency-path: mobile_app/pubspec.lock
      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: mobile_app
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: mobile_app
        run: flutter test --no-pub
