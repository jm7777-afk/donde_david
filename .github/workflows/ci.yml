name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Compile check and Alembic schema check
        run: |
          python -m compileall -q backend/app tests
          python -m alembic upgrade head
          python -m alembic check

      - name: JavaScript syntax checks
        run: |
          for file in backend/static/js/*.js backend/static/sw.js; do
            node --check "$file"
          done

      - name: Run full pytest suite
        run: |
          pytest tests backend/scripts/test_api.py -v --tb=short
